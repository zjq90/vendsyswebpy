<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 自动售货机管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .login-body {
            padding: 40px;
            background: white;
        }
        .login-header h1 {
            font-size: 28px;
            margin: 0;
            font-weight: 600;
        }
        .login-header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
        }
        .form-control:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 0.2rem rgba(79, 172, 254, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
            color: white;
        }
        .input-group-text {
            background: transparent;
            border-right: none;
            border-color: #e0e0e0;
        }
        .input-group-text + .form-control {
            border-left: none;
        }
        .test-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
        }
        .test-info h5 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #495057;
        }
        .test-info p {
            margin: 5px 0;
            color: #6c757d;
        }
        .test-info code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5 col-lg-4">
                <div class="login-card">
                    <div class="login-header">
                        <i class="fa fa-cogs" style="font-size: 48px; margin-bottom: 10px;"></i>
                        <h1>自动售货机管理系统</h1>
                        <p>Vending Machine Management System</p>
                    </div>
                    <div class="login-body">
                        <form id="loginForm">
                            <div class="form-group">
                                <label class="font-weight-bold">用户名</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">
                                            <i class="fa fa-user"></i>
                                        </span>
                                    </div>
                                    <input type="text" class="form-control" id="username" 
                                           placeholder="请输入用户名" required autocomplete="username">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="font-weight-bold">密码</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">
                                            <i class="fa fa-lock"></i>
                                        </span>
                                    </div>
                                    <input type="password" class="form-control" id="password" 
                                           placeholder="请输入密码" required autocomplete="current-password">
                                </div>
                            </div>
                            <div class="form-group mt-4">
                                <button type="submit" class="btn btn-login btn-block" id="loginBtn">
                                    <i class="fa fa-sign-in mr-2"></i>登 录
                                </button>
                            </div>
                        </form>
                        
                        <div class="test-info">
                            <h5><i class="fa fa-info-circle mr-2"></i>测试账号</h5>
                            <p><i class="fa fa-user-circle mr-2"></i>管理员：<code>admin</code> / <code>admin123</code></p>
                            <p><i class="fa fa-user mr-2"></i>业务员：<code>salesman</code> / <code>sales123</code></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(() => {
            // 清除之前的登录状态
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            
            $('#loginForm').submit(async (e) => {
                e.preventDefault();
                
                const username = $('#username').val().trim();
                const password = $('#password').val();
                
                if (!username || !password) {
                    alert('请输入用户名和密码');
                    return;
                }
                
                const $btn = $('#loginBtn');
                const originalText = $btn.html();
                $btn.html('<i class="fa fa-spinner fa-spin mr-2"></i>登录中...').prop('disabled', true);
                
                try {
                    const formData = new FormData();
                    formData.append('username', username);
                    formData.append('password', password);
                    
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.detail || '登录失败');
                    }
                    
                    // 保存登录信息
                    localStorage.setItem('authToken', data.access_token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // 显示成功消息
                    showSuccessMessage('登录成功，正在跳转...');
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                    
                } catch (error) {
                    showErrorMessage(error.message || '登录失败');
                    $btn.html(originalText).prop('disabled', false);
                }
            });
            
            // 回车登录
            $('#password').keypress((e) => {
                if (e.which === 13) {
                    $('#loginForm').submit();
                }
            });
        });
        
        function showSuccessMessage(message) {
            const $alert = $('<div class="alert alert-success alert-dismissible fade show fixed-top m-3" role="alert" style="z-index: 9999; max-width: 400px; right: 0;">' +
                '<strong><i class="fa fa-check-circle mr-2"></i></strong>' + message +
                '<button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>' +
                '</div>');
            $('body').append($alert);
            setTimeout(() => $alert.alert('close'), 3000);
        }
        
        function showErrorMessage(message) {
            const $alert = $('<div class="alert alert-danger alert-dismissible fade show fixed-top m-3" role="alert" style="z-index: 9999; max-width: 400px; right: 0;">' +
                '<strong><i class="fa fa-exclamation-circle mr-2"></i></strong>' + message +
                '<button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>' +
                '</div>');
            $('body').append($alert);
            setTimeout(() => $alert.alert('close'), 3000);
        }
    </script>
</body>
</html>
