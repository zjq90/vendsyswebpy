<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}自动售货机管理系统{% endblock %}</title>
    
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-cash-register mr-2"></i>
                售货机管理系统
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item {% if request.url.path == '/' %}active{% endif %}">
                        <a class="nav-link" href="/">
                            <i class="fas fa-tachometer-alt mr-1"></i>仪表板
                        </a>
                    </li>
                    <li class="nav-item {% if '/products' in request.url.path %}active{% endif %}">
                        <a class="nav-link" href="/products">
                            <i class="fas fa-box mr-1"></i>商品管理
                        </a>
                    </li>
                    <li class="nav-item {% if '/vending-machines' in request.url.path %}active{% endif %}">
                        <a class="nav-link" href="/vending-machines">
                            <i class="fas fa-microchip mr-1"></i>设备管理
                        </a>
                    </li>
                    <li class="nav-item {% if '/inventory' in request.url.path %}active{% endif %}">
                        <a class="nav-link" href="/inventory">
                            <i class="fas fa-warehouse mr-1"></i>库存管理
                        </a>
                    </li>
                    <li class="nav-item {% if '/replenishment' in request.url.path %}active{% endif %}">
                        <a class="nav-link" href="/replenishment">
                            <i class="fas fa-truck mr-1"></i>补货管理
                        </a>
                    </li>
                    <li class="nav-item {% if '/price-strategies' in request.url.path %}active{% endif %}">
                        <a class="nav-link" href="/price-strategies">
                            <i class="fas fa-tags mr-1"></i>价格策略
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle" data-toggle="dropdown">
                            <i class="fas fa-tools mr-1"></i>工具
                        </button>
                        <div class="dropdown-menu dropdown-menu-right">
                            <a class="dropdown-item" href="#" onclick="initTestData();return false;">
                                <i class="fas fa-database mr-2 text-primary"></i>初始化测试数据
                            </a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="/docs" target="_blank">
                                <i class="fas fa-book mr-2 text-info"></i>API文档
                            </a>
                            <a class="dropdown-item" href="/redoc" target="_blank">
                                <i class="fas fa-file-alt mr-2 text-info"></i>API文档(ReDoc)
                            </a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="footer bg-light py-3 mt-auto">
        <div class="container text-center text-muted">
            <small>
                <i class="fas fa-copyright mr-1"></i>2026 自动售货机商品与库存管理系统 v1.0.0
            </small>
        </div>
    </footer>

    <!-- Toast提示容器 -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
        <div id="toast" class="toast" role="alert" data-delay="3000">
            <div class="toast-header">
                <strong class="mr-auto" id="toastTitle">提示</strong>
                <button type="button" class="ml-2 mb-1 close" data-dismiss="toast">
                    <span>&times;</span>
                </button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <!-- jQuery和Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 通用JS工具 -->
    <script src="/static/js/common.js"></script>
    
    <!-- 页面初始化脚本 -->
    <script>
        $(document).ready(function() {
            // 初始化Toast
            $('.toast').toast({
                delay: 5000,
                autohide: true
            });
            
            // 为所有模态框添加ESC键关闭支持
            $('.modal').on('shown.bs.modal', function() {
                $(this).attr('tabindex', '-1');
            });
            
            // 表单输入聚焦效果
            $('input, select, textarea').on('focus', function() {
                $(this).closest('.form-group').addClass('focused');
            }).on('blur', function() {
                $(this).closest('.form-group').removeClass('focused');
            });
            
            // 检查是否需要显示初始化提示（只在首页显示）
            if (window.location.pathname === '/' || window.location.pathname === '') {
                // 延迟1秒后显示提示
                setTimeout(function() {
                    // 检查localStorage是否已经显示过提示
                    const hasShownInitHint = localStorage.getItem('hasShownInitHint');
                    if (!hasShownInitHint) {
                        showToast('提示', '💡 首次使用请点击右上角「工具」→「初始化测试数据」来生成测试数据', 'info');
                        localStorage.setItem('hasShownInitHint', 'true');
                    }
                }, 1000);
            }
            
            console.log('✅ 自动售货机管理系统 - 页面已加载');
        });
        
        // 提供一个重置提示的方法（调试用）
        function resetInitHint() {
            localStorage.removeItem('hasShownInitHint');
            showToast('提示', '初始化提示已重置', 'info');
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
