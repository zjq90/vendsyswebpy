{% extends "base.html" %}

{% block title %}库存管理 - 自动售货机管理系统{% endblock %}

{% block content %}
<!-- 页面标题 -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-warehouse text-primary mr-2"></i>库存管理</h2>
    <div>
        <button class="btn btn-success mr-2" data-toggle="modal" data-target="#restockModal" onclick="resetRestockForm()">
            <i class="fas fa-plus mr-1"></i>补货
        </button>
        <button class="btn btn-info" data-toggle="modal" data-target="#saleModal" onclick="resetSaleForm()">
            <i class="fas fa-shopping-cart mr-1"></i>模拟销售
        </button>
    </div>
</div>

<!-- 库存统计 -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title">总绑定货道</h6>
                        <h2 id="totalBindings">0</h2>
                    </div>
                    <i class="fas fa-link fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title">库存充足</h6>
                        <h2 id="normalStock">0</h2>
                    </div>
                    <i class="fas fa-check-circle fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title">低库存</h6>
                        <h2 id="lowStock">0</h2>
                    </div>
                    <i class="fas fa-exclamation-triangle fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-danger">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title">已售空</h6>
                        <h2 id="emptyStock">0</h2>
                    </div>
                    <i class="fas fa-times-circle fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 筛选栏 -->
<div class="card shadow mb-4">
    <div class="card-body">
        <form id="filterForm" class="form-row align-items-end">
            <div class="form-group col-md-3">
                <label class="small font-weight-bold">选择售货机</label>
                <select class="form-control" id="machineFilter">
                    <option value="">全部设备</option>
                </select>
            </div>
            <div class="form-group col-md-2">
                <label class="small font-weight-bold">库存状态</label>
                <select class="form-control" id="stockStatusFilter">
                    <option value="">全部状态</option>
                    <option value="low">低库存</option>
                    <option value="empty">已售空</option>
                    <option value="normal">库存充足</option>
                </select>
            </div>
            <div class="form-group col-md-2">
                <label class="small font-weight-bold">关键词</label>
                <input type="text" class="form-control" id="keyword" placeholder="商品名称">
            </div>
            <div class="form-group col-md-2">
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-search mr-1"></i>筛选
                </button>
            </div>
            <div class="form-group col-md-1">
                <button type="button" class="btn btn-outline-secondary btn-block" onclick="resetFilter()">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 库存列表 -->
<div class="card shadow">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary">库存列表</h6>
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-toggle="dropdown">
                <i class="fas fa-cog mr-1"></i>批量操作
            </button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#" onclick="showBatchBindingModal()">
                    <i class="fas fa-link mr-2"></i>批量绑定商品
                </a>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover" id="inventoryTable">
                <thead class="thead-light">
                    <tr>
                        <th>设备</th>
                        <th>货道</th>
                        <th>商品</th>
                        <th>当前库存</th>
                        <th>库存阈值</th>
                        <th>销售价</th>
                        <th>状态</th>
                        <th style="width: 180px;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="text-center text-muted py-5">请先选择售货机查看库存</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 补货模态框 -->
<div class="modal fade" id="restockModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-plus-circle mr-2"></i>补货操作</h5>
                <button type="button" class="close text-white" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <form id="restockForm">
                <input type="hidden" id="restockBindingId">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="font-weight-bold">选择货道商品</label>
                        <select class="form-control" id="restockBinding" required>
                            <option value="">请选择...</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">当前库存</label>
                            <input type="text" class="form-control" id="restockCurrentStock" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">最大容量</label>
                            <input type="text" class="form-control" id="restockMaxCapacity" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">补货数量 <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="restockQuantity" min="1" required placeholder="输入补货数量">
                        <small class="form-text text-muted">最多可补货 <span id="maxPossible">0</span> 件</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-check mr-1"></i>确认补货
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 模拟销售模态框 -->
<div class="modal fade" id="saleModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="fas fa-shopping-cart mr-2"></i>模拟销售</h5>
                <button type="button" class="close text-white" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <form id="saleForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="font-weight-bold">选择货道商品</label>
                        <select class="form-control" id="saleBinding" required>
                            <option value="">请选择...</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">当前库存</label>
                            <input type="text" class="form-control" id="saleCurrentStock" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">销售单价</label>
                            <input type="text" class="form-control" id="salePrice" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">销售数量 <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="saleQuantity" min="1" value="1" required placeholder="输入销售数量">
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">订单号（可选）</label>
                        <input type="text" class="form-control" id="saleOrderNumber" placeholder="如：ORD20260502001">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-info">
                        <i class="fas fa-check mr-1"></i>确认销售
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 编辑绑定模态框 -->
<div class="modal fade" id="editBindingModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑货道绑定</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <form id="editBindingForm">
                <input type="hidden" id="editBindingId">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">商品</label>
                            <select class="form-control" id="editProduct">
                                <option value="">请选择商品</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">状态</label>
                            <select class="form-control" id="editStatus">
                                <option value="active">启用</option>
                                <option value="inactive">禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">当前库存</label>
                            <input type="number" class="form-control" id="editCurrentStock" min="0">
                        </div>
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">库存阈值</label>
                            <input type="number" class="form-control" id="editThreshold" min="0" placeholder="默认5">
                        </div>
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">销售价（可选）</label>
                            <input type="number" class="form-control" id="editSalePrice" step="0.01" min="0" placeholder="留空使用商品零售价">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save mr-1"></i>保存
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let machines = [];
let bindings = [];
let products = [];

$(document).ready(function() {
    loadMachines();
    loadProducts();
    setupFormHandlers();
});

function loadMachines() {
    $.get('/api/vending-machines/', function(data) {
        machines = data;
        const select = $('#machineFilter');
        select.empty().append('<option value="">全部设备</option>');
        data.forEach(m => {
            select.append(`<option value="${m.id}">${m.name}</option>`);
        });
    });
}

function loadProducts() {
    $.get('/api/products/', function(data) {
        products = data;
        const select = $('#editProduct');
        select.empty().append('<option value="">请选择商品</option>');
        data.forEach(p => {
            select.append(`<option value="${p.id}">${p.name} (¥${p.retail_price})</option>`);
        });
    });
}

function loadInventory() {
    const machineId = $('#machineFilter').val();
    const stockStatus = $('#stockStatusFilter').val();
    const keyword = $('#keyword').val();
    
    if (!machineId) {
        $('#inventoryTable tbody').html('<tr><td colspan="8" class="text-center text-muted py-5">请先选择售货机查看库存</td></tr>');
        return;
    }
    
    let url = `/api/vending-machines/${machineId}/aisle-products/`;
    let params = [];
    
    if (stockStatus === 'low') {
        params.push('low_stock_only=true');
    }
    
    if (params.length > 0) {
        url += '?' + params.join('&');
    }
    
    $.get(url, function(data) {
        bindings = data;
        
        // 按关键词过滤
        if (keyword) {
            data = data.filter(b => 
                b.product && b.product.name.toLowerCase().includes(keyword.toLowerCase())
            );
        }
        
        // 按库存状态过滤
        if (stockStatus === 'normal') {
            data = data.filter(b => b.current_stock > b.stock_threshold);
        } else if (stockStatus === 'empty') {
            data = data.filter(b => b.current_stock === 0);
        }
        
        renderInventoryTable(data);
        updateStats(data);
        updateBindingSelects(data);
    });
}

function renderInventoryTable(data) {
    const tbody = $('#inventoryTable tbody');
    
    if (data.length === 0) {
        tbody.html('<tr><td colspan="8" class="text-center text-muted py-5">暂无库存数据</td></tr>');
        return;
    }
    
    let html = '';
    data.forEach(binding => {
        const product = binding.product;
        const aisle = binding.aisle;
        
        // 库存状态
        let stockStatus, stockClass, stockIcon;
        if (binding.current_stock === 0) {
            stockStatus = '已售空';
            stockClass = 'danger';
            stockIcon = 'fa-times-circle';
        } else if (binding.current_stock <= binding.stock_threshold) {
            stockStatus = '低库存';
            stockClass = 'warning';
            stockIcon = 'fa-exclamation-triangle';
        } else {
            stockStatus = '正常';
            stockClass = 'success';
            stockIcon = 'fa-check-circle';
        }
        
        const stockPercent = binding.aisle ? (binding.current_stock / binding.aisle.max_capacity * 100) : 0;
        
        const salePrice = binding.sale_price || (product ? product.retail_price : 0);
        
        html += `
            <tr>
                <td>${aisle && aisle.vending_machine ? aisle.vending_machine.name : '-'}</td>
                <td><span class="badge badge-secondary">${aisle ? aisle.aisle_code : '-'}</span></td>
                <td>
                    <div class="d-flex align-items-center">
                        ${product ? product.name : '-'}
                        ${binding.status !== 'active' ? '<span class="badge badge-secondary ml-2">已禁用</span>' : ''}
                    </div>
                </td>
                <td>
                    <div class="d-flex align-items-center">
                        <i class="fas ${stockIcon} text-${stockClass} mr-2"></i>
                        <span class="font-weight-bold">${binding.current_stock}</span>
                        <span class="text-muted ml-1">/ ${aisle ? aisle.max_capacity : 0}</span>
                    </div>
                    <div class="progress" style="height: 4px; margin-top: 4px;">
                        <div class="progress-bar bg-${stockClass}" style="width: ${stockPercent}%"></div>
                    </div>
                </td>
                <td>${binding.stock_threshold}</td>
                <td class="text-primary font-weight-bold">¥${parseFloat(salePrice).toFixed(2)}</td>
                <td><span class="badge badge-${stockClass}">${stockStatus}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-success mr-1" onclick="quickRestock(${binding.id})" title="补货">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-info mr-1" onclick="quickSale(${binding.id})" title="销售">
                        <i class="fas fa-shopping-cart"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-primary mr-1" onclick="editBinding(${binding.id})" title="编辑">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="unbindProduct(${binding.id})" title="解除绑定">
                        <i class="fas fa-unlink"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    tbody.html(html);
}

function updateStats(data) {
    let total = data.length;
    let normal = 0, low = 0, empty = 0;
    
    data.forEach(b => {
        if (b.current_stock === 0) empty++;
        else if (b.current_stock <= b.stock_threshold) low++;
        else normal++;
    });
    
    $('#totalBindings').text(total);
    $('#normalStock').text(normal);
    $('#lowStock').text(low);
    $('#emptyStock').text(empty);
}

function updateBindingSelects(data) {
    const restockSelect = $('#restockBinding');
    const saleSelect = $('#saleBinding');
    
    restockSelect.empty().append('<option value="">请选择...</option>');
    saleSelect.empty().append('<option value="">请选择...</option>');
    
    data.forEach(b => {
        const aisle = b.aisle;
        const product = b.product;
        const text = `[${aisle ? aisle.aisle_code : '-'}] ${product ? product.name : '-'} (库存: ${b.current_stock})`;
        
        restockSelect.append(`<option value="${b.id}">${text}</option>`);
        if (b.current_stock > 0) {
            saleSelect.append(`<option value="${b.id}">${text}</option>`);
        }
    });
}

function setupFormHandlers() {
    $('#filterForm').on('submit', function(e) {
        e.preventDefault();
        loadInventory();
    });
    
    // 设备选择变化时自动加载
    $('#machineFilter').on('change', function() {
        loadInventory();
    });
    
    // 补货表单
    $('#restockForm').on('submit', function(e) {
        e.preventDefault();
        processRestock();
    });
    
    // 销售表单
    $('#saleForm').on('submit', function(e) {
        e.preventDefault();
        processSale();
    });
    
    // 编辑绑定表单
    $('#editBindingForm').on('submit', function(e) {
        e.preventDefault();
        saveBinding();
    });
    
    // 补货选择变化
    $('#restockBinding').on('change', function() {
        const id = $(this).val();
        if (id) {
            const binding = bindings.find(b => b.id == id);
            if (binding) {
                $('#restockCurrentStock').val(binding.current_stock);
                const maxCapacity = binding.aisle ? binding.aisle.max_capacity : 10;
                $('#restockMaxCapacity').val(maxCapacity);
                const maxPossible = maxCapacity - binding.current_stock;
                $('#maxPossible').text(maxPossible);
                $('#restockQuantity').attr('max', maxPossible);
            }
        }
    });
    
    // 销售选择变化
    $('#saleBinding').on('change', function() {
        const id = $(this).val();
        if (id) {
            const binding = bindings.find(b => b.id == id);
            if (binding) {
                $('#saleCurrentStock').val(binding.current_stock);
                const price = binding.sale_price || (binding.product ? binding.product.retail_price : 0);
                $('#salePrice').val(`¥${parseFloat(price).toFixed(2)}`);
                $('#saleQuantity').attr('max', binding.current_stock);
            }
        }
    });
}

function resetRestockForm() {
    $('#restockBindingId').val('');
    $('#restockBinding').val('');
    $('#restockCurrentStock').val('');
    $('#restockMaxCapacity').val('');
    $('#restockQuantity').val('');
    $('#maxPossible').text('0');
}

function resetSaleForm() {
    $('#saleBinding').val('');
    $('#saleCurrentStock').val('');
    $('#salePrice').val('');
    $('#saleQuantity').val(1);
    $('#saleOrderNumber').val('');
}

function quickRestock(bindingId) {
    resetRestockForm();
    $('#restockBinding').val(bindingId).trigger('change');
    $('#restockModal').modal('show');
}

function quickSale(bindingId) {
    resetSaleForm();
    $('#saleBinding').val(bindingId).trigger('change');
    $('#saleModal').modal('show');
}

function processRestock() {
    const bindingId = $('#restockBinding').val();
    const quantity = parseInt($('#restockQuantity').val());
    
    if (!bindingId || !quantity) return;
    
    $.ajax({
        url: `/api/inventory/restock/?binding_id=${bindingId}&quantity=${quantity}`,
        method: 'POST',
        success: function(response) {
            $('#restockModal').modal('hide');
            showToast('成功', response.message, 'success');
            loadInventory();
        },
        error: function(xhr) {
            const msg = xhr.responseJSON ? xhr.responseJSON.detail : '操作失败';
            showToast('错误', msg, 'error');
        }
    });
}

function processSale() {
    const bindingId = $('#saleBinding').val();
    const quantity = parseInt($('#saleQuantity').val());
    const orderNumber = $('#saleOrderNumber').val() || null;
    
    if (!bindingId || !quantity) return;
    
    const data = {
        aisle_product_id: parseInt(bindingId),
        quantity: quantity,
        order_number: orderNumber
    };
    
    $.ajax({
        url: '/api/sales/',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(response) {
            $('#saleModal').modal('hide');
            showToast('成功', response.message, 'success');
            loadInventory();
        },
        error: function(xhr) {
            const msg = xhr.responseJSON ? xhr.responseJSON.detail : '操作失败';
            showToast('错误', msg, 'error');
        }
    });
}

function editBinding(bindingId) {
    const binding = bindings.find(b => b.id == bindingId);
    if (!binding) return;
    
    $('#editBindingId').val(bindingId);
    $('#editProduct').val(binding.product_id);
    $('#editStatus').val(binding.status);
    $('#editCurrentStock').val(binding.current_stock);
    $('#editThreshold').val(binding.stock_threshold);
    $('#editSalePrice').val(binding.sale_price || '');
    
    $('#editBindingModal').modal('show');
}

function saveBinding() {
    const id = $('#editBindingId').val();
    const data = {
        product_id: parseInt($('#editProduct').val()) || null,
        status: $('#editStatus').val(),
        current_stock: parseInt($('#editCurrentStock').val()),
        stock_threshold: parseInt($('#editThreshold').val()),
        sale_price: $('#editSalePrice').val() ? parseFloat($('#editSalePrice').val()) : null
    };
    
    $.ajax({
        url: `/api/aisle-products/${id}`,
        method: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function() {
            $('#editBindingModal').modal('hide');
            showToast('成功', '绑定更新成功', 'success');
            loadInventory();
        },
        error: function(xhr) {
            const msg = xhr.responseJSON ? xhr.responseJSON.detail : '操作失败';
            showToast('错误', msg, 'error');
        }
    });
}

function unbindProduct(bindingId) {
    if (confirm('确定要解除此货道的商品绑定吗？')) {
        $.ajax({
            url: `/api/aisle-products/${bindingId}`,
            method: 'DELETE',
            success: function(response) {
                showToast('成功', response.message, 'success');
                loadInventory();
            },
            error: function(xhr) {
                const msg = xhr.responseJSON ? xhr.responseJSON.detail : '操作失败';
                showToast('错误', msg, 'error');
            }
        });
    }
}

function resetFilter() {
    $('#machineFilter').val('');
    $('#stockStatusFilter').val('');
    $('#keyword').val('');
    loadInventory();
}
</script>
{% endblock %}
