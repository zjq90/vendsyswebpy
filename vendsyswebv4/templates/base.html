<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}自动售后机数据统计与分析系统{% endblock %}</title>
    
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    
    <!-- Bootstrap 4 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- ECharts for dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <!-- 自定义样式 -->
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
            --success-color: #1cc88a;
            --info-color: #36b9cc;
            --warning-color: #f6c23e;
            --danger-color: #e74a3b;
            --dark-color: #5a5c69;
            --light-color: #f8f9fc;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fc;
        }
        
        /* 导航栏样式 */
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }
        
        .navbar-dark.bg-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }
        
        /* 侧边栏样式 */
        .sidebar {
            position: fixed;
            top: 56px;
            left: 0;
            width: 250px;
            height: calc(100vh - 56px);
            background: linear-gradient(180deg, #4e73df 0%, #224abe 100%);
            color: white;
            transition: all 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }
        
        .sidebar.collapsed {
            width: 70px;
        }
        
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar-menu li {
            position: relative;
        }
        
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .sidebar-menu li a i {
            width: 30px;
            text-align: center;
            font-size: 1.2rem;
        }
        
        .sidebar-menu li a span {
            margin-left: 10px;
            white-space: nowrap;
        }
        
        .sidebar.collapsed .sidebar-menu li a span {
            display: none;
        }
        
        .sidebar.collapsed .sidebar-menu li a {
            justify-content: center;
        }
        
        /* 主内容区域 */
        .main-content {
            margin-left: 250px;
            padding-top: 56px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .main-content.expanded {
            margin-left: 70px;
        }
        
        /* 卡片样式 */
        .card {
            border: none;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            background-color: #f8f9fc;
            border-bottom: 1px solid #e3e6f0;
            padding: 0.75rem 1.25rem;
        }
        
        .card-header h6 {
            margin: 0;
            font-weight: 700;
            color: #4e73df;
        }
        
        /* 统计卡片 */
        .stats-card {
            border-left: 0.25rem solid;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .stats-card.primary {
            border-left-color: #4e73df;
        }
        
        .stats-card.success {
            border-left-color: #1cc88a;
        }
        
        .stats-card.info {
            border-left-color: #36b9cc;
        }
        
        .stats-card.warning {
            border-left-color: #f6c23e;
        }
        
        .stats-card.danger {
            border-left-color: #e74a3b;
        }
        
        .stats-card .stats-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
        }
        
        .stats-card .stats-label {
            color: #858796;
            font-size: 0.85rem;
            margin: 0;
        }
        
        .stats-card .stats-icon {
            font-size: 2rem;
            color: #dddfeb;
        }
        
        /* 表格样式 */
        .table-responsive {
            border-radius: 0.35rem;
        }
        
        .table thead th {
            background-color: #f8f9fc;
            border-bottom: 2px solid #e3e6f0;
            font-weight: 600;
            color: #5a5c69;
        }
        
        /* 按钮样式 */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
        }
        
        /* 标签样式 */
        .badge {
            padding: 0.4em 0.6em;
            font-weight: 500;
        }
        
        .badge-success {
            background-color: #1cc88a;
        }
        
        .badge-warning {
            background-color: #f6c23e;
        }
        
        .badge-danger {
            background-color: #e74a3b;
        }
        
        .badge-info {
            background-color: #36b9cc;
        }
        
        /* 日期选择器容器 */
        .date-range {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .date-range input {
            max-width: 150px;
        }
        
        /* 图表容器 */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .chart-container-large {
            height: 400px;
        }
        
        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
            color: #4e73df;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #858796;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        /* 热力图样式 */
        .heatmap-cell {
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .heatmap-cell:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.show {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .date-range {
                flex-direction: column;
                align-items: stretch;
            }
            
            .date-range input {
                max-width: none;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* 页面标题 */
        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #5a5c69;
            margin-bottom: 1.5rem;
        }
        
        /* 面包屑 */
        .breadcrumb {
            background-color: transparent;
            padding: 0;
            margin-bottom: 1rem;
        }
        
        .breadcrumb-item a {
            color: #4e73df;
        }
        
        .breadcrumb-item.active {
            color: #858796;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <a class="navbar-brand" href="/">
            <i class="fa fa-cubes mr-2"></i>
            自动售后机数据分析
        </a>
        
        <button class="navbar-toggler" type="button" id="sidebarToggleMobile">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="notificationsDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-bell-o"></i>
                        <span class="badge badge-danger">3</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="#">
                            <i class="fa fa-exclamation-triangle text-warning mr-2"></i>
                            设备A001离线
                        </a>
                        <a class="dropdown-item" href="#">
                            <i class="fa fa-exclamation-circle text-danger mr-2"></i>
                            库存不足预警
                        </a>
                        <a class="dropdown-item" href="#">
                            <i class="fa fa-info-circle text-info mr-2"></i>
                            系统更新通知
                        </a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa fa-user-circle-o"></i>
                        管理员
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li>
                <a href="/sales" class="{% if active_page == 'sales' %}active{% endif %}">
                    <i class="fa fa-line-chart"></i>
                    <span>销售报表</span>
                </a>
            </li>
            <li>
                <a href="/products" class="{% if active_page == 'products' %}active{% endif %}">
                    <i class="fa fa-shopping-bag"></i>
                    <span>商品分析</span>
                </a>
            </li>
            <li>
                <a href="/devices" class="{% if active_page == 'devices' %}active{% endif %}">
                    <i class="fa fa-cogs"></i>
                    <span>设备效能</span>
                </a>
            </li>
            <li>
                <a href="/users" class="{% if active_page == 'users' %}active{% endif %}">
                    <i class="fa fa-users"></i>
                    <span>用户行为</span>
                </a>
            </li>
            <li>
                <a href="/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">
                    <i class="fa fa-tv"></i>
                    <span>可视化大屏</span>
                </a>
            </li>
        </ul>
    </aside>
    
    <!-- 主内容区域 -->
    <main class="main-content p-4" id="mainContent">
        <!-- 面包屑 -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">首页</a></li>
                <li class="breadcrumb-item active" aria-current="page">{% block breadcrumb %}数据分析{% endblock %}</li>
            </ol>
        </nav>
        
        <!-- 页面内容 -->
        {% block content %}{% endblock %}
    </main>
    
    <!-- 自定义脚本 -->
    <script>
        // API基础地址
        const API_BASE = '/api/v1';
        
        // 侧边栏切换
        $('#sidebarToggle').on('click', function() {
            $('#sidebar').toggleClass('collapsed');
            $('#mainContent').toggleClass('expanded');
        });
        
        $('#sidebarToggleMobile').on('click', function() {
            $('#sidebar').toggleClass('show');
        });
        
        // 格式化数字
        function formatNumber(num) {
            if (num === null || num === undefined) return '0';
            return num.toLocaleString('zh-CN');
        }
        
        // 格式化货币
        function formatCurrency(num) {
            if (num === null || num === undefined) return '¥0.00';
            return '¥' + num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        // 格式化百分比
        function formatPercent(num) {
            if (num === null || num === undefined) return '0.00%';
            return num.toFixed(2) + '%';
        }
        
        // 获取今日日期
        function getToday() {
            return new Date().toISOString().split('T')[0];
        }
        
        // 获取N天前日期
        function getDaysAgo(days) {
            const date = new Date();
            date.setDate(date.getDate() - days);
            return date.toISOString().split('T')[0];
        }
        
        // 显示加载状态
        function showLoading(selector) {
            $(selector).html(`
                <div class="loading active">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">加载中...</span>
                    </div>
                    <p class="mt-3">数据加载中...</p>
                </div>
            `);
        }
        
        // 显示空状态
        function showEmpty(selector, message) {
            $(selector).html(`
                <div class="empty-state">
                    <i class="fa fa-database"></i>
                    <p>${message || '暂无数据'}</p>
                </div>
            `);
        }
        
        // 显示错误
        function showError(selector, message) {
            $(selector).html(`
                <div class="alert alert-danger" role="alert">
                    <i class="fa fa-exclamation-circle mr-2"></i>
                    ${message || '加载失败，请稍后重试'}
                </div>
            `);
        }
        
        // API请求封装
        async function apiGet(url, params = {}) {
            const queryString = new URLSearchParams(params).toString();
            const fullUrl = queryString ? `${API_BASE}${url}?${queryString}` : `${API_BASE}${url}`;
            
            try {
                const response = await fetch(fullUrl);
                const data = await response.json();
                if (data.code === 200) {
                    return data.data;
                } else {
                    throw new Error(data.message || '请求失败');
                }
            } catch (error) {
                console.error('API请求失败:', error);
                throw error;
            }
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
