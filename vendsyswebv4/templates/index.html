    <!-- 自定义样式 -->

            --secondary-color: #858796;

        }
        
        .sidebar-menu {

        .sidebar-menu li a {
            display: flex;

            padding: 15px 20px;

        .stats-card.success {

        }
        
        .stats-card.info {

        }
        
        .stats-card.warning {

        }
        
        .stats-card .stats-value {
            font-size: 2rem;

            margin: 0;
        }
        
        .stats-card .stats-label {
            color: #858796;
            font-size: 0.85rem;
            margin: 0;
        }
        
        .stats-card .stats-icon {
            font-size: 2rem;
            color: #dddfeb;
        }
        
        .table-responsive {
            border-radius: 0.35rem;
        }
        
        .table thead th {
            background-color: #f8f9fc;
            border-bottom: 2px solid #e3e6f0;
            font-weight: 600;
            color: #5a5c69;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
        }
        
        .badge {
            padding: 0.4em 0.6em;
            font-weight: 500;
        }
        
        .badge-success {
            background-color: #1cc88a;
        }
        
        .badge-warning {
            background-color: #f6c23e;
        }
        
        .badge-info {
            background-color: #36b9cc;
        }
        
        .date-range {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .date-range input {
            max-width: 150px;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .chart-container-large {
            height: 400px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner-border {

            color: #4e73df;
        }
        
        .empty-state {

            margin-bottom: 1rem;

        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.show {
                transform: translateX(0);
            }
            
            .main-content {

            }
            
            .date-range {

                align-items: stretch;
            }
            
            .date-range input {
                max-width: none;
            }
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;

        }
        
        .page-title {

            color: #5a5c69;

        }
        
        .breadcrumb {

        }
        
        .breadcrumb-item a {
            color: #4e73df;
        }
        
        .breadcrumb-item.active {
            color: #858796;
        }
    </style>
</head>

    <script>
        const API_BASE = '/api/v1';
        let salesTrendChart = null;
        let paymentChart = null;
        let currentPage = 1;
        const pageSize = 10;
        
        function getToday() {
            return new Date().toISOString().split('T')[0];
        }
        
        function getDaysAgo(days) {
            const date = new Date();
            date.setDate(date.getDate() - days);
            return date.toISOString().split('T')[0];
        }
        
        function formatNumber(num) {
            if (num === null || num === undefined) return '0';
            return num.toLocaleString('zh-CN');
        }
        
        function formatCurrency(num) {
            if (num === null || num === undefined) return '¥0.00';
            return '¥' + num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        function formatPercent(num) {
            if (num === null || num === undefined) return '0.00%';
            return num.toFixed(2) + '%';
        }
        
        async function apiGet(url, params = {}) {
            const queryString = new URLSearchParams(params).toString();
            const fullUrl = queryString ? `${API_BASE}${url}?${queryString}` : `${API_BASE}${url}`;
            
            try {
                const response = await fetch(fullUrl);
                const data = await response.json();
                if (data.code === 200) {
                    return data.data;
                } else {
                    throw new Error(data.message || '请求失败');
                }
            } catch (error) {
                console.error('API请求失败:', error);
                throw error;
            }
        }
        
        function showLoading(selector) {
            $(selector).html(`
                <div class="loading active">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">加载中...</span>
                    </div>
                    <p class="mt-3">数据加载中...</p>
                </div>
            `);
        }
        
        function showEmpty(selector, message) {
            $(selector).html(`
                <div class="empty-state">
                    <i class="fa fa-database"></i>
                    <p>${message || '暂无数据'}</p>
                </div>
            `);
        }
        
        function showError(selector, message) {
            $(selector).html(`
                <div class="alert alert-danger" role="alert">
                    <i class="fa fa-exclamation-circle mr-2"></i>
                    ${message || '加载失败，请稍后重试'}
                </div>
            `);
        }
        
        $('#sidebarToggleMobile').on('click', function() {
            $('#sidebar').toggleClass('show');
        });
        
        $(document).ready(function() {
            $('#startDate').val(getDaysAgo(30));
            $('#endDate').val(getToday());
            
            loadSalesSummary();
            loadSalesTrend();
            loadPaymentDistribution();
            loadTopDevices();
            loadSalesList();
        });
        
        $('#btnQuery').on('click', function() {
            loadSalesSummary();
            loadSalesTrend();
            loadPaymentDistribution();
            loadTopDevices();
            loadSalesList();
        });
        
        $('#btnRefresh').on('click', function() {
            loadSalesList();
        });
        
        $('#timeDimension').on('change', function() {
            loadSalesTrend();
        });
        
        async function loadSalesSummary() {
            try {
                const data = await apiGet('/sales/summary', {
                    start_date: $('#startDate').val(),
                    end_date: $('#endDate').val()
                });
                
                $('#totalSales').text(formatCurrency(data.total_sales));
                $('#totalOrders').text(formatNumber(data.total_orders));
                $('#avgOrderValue').text(formatCurrency(data.avg_order_value));
                
                const daysDiff = Math.ceil((new Date($('#endDate').val()) - new Date($('#startDate').val())) / (1000 * 60 * 60 * 24)) + 1;
                const avgDaily = daysDiff > 0 ? data.total_sales / daysDiff : 0;
                $('#avgDailySales').text(formatCurrency(avgDaily));
            } catch (error) {
                console.error('加载销售汇总失败:', error);
            }
        }
        
        async function loadSalesTrend() {
            try {
                const dimension = $('#timeDimension').val();
                let endpoint = '';
                let labelText = '';
                
                switch(dimension) {
                    case 'weekly':
                        endpoint = '/sales/weekly';
                        labelText = '周';
                        break;
                    case 'monthly':
                        endpoint = '/sales/monthly';
                        labelText = '月';
                        break;
                    case 'yearly':
                        endpoint = '/sales/yearly';
                        labelText = '年';
                        break;
                    default:
                        endpoint = '/sales/daily';
                        labelText = '日';
                }
                
                const data = await apiGet(endpoint, {
                    start_date: $('#startDate').val(),
                    end_date: $('#endDate').val(),
                    limit: 30
                });
                
                if (!data || data.length === 0) {
                    showEmpty('#salesChartContainer', '暂无销售趋势数据');
                    return;
                }
                
                const labels = data.map(item => {
                    if (dimension === 'daily') {
                        return item.date;
                    } else if (dimension === 'weekly') {
                        return `${item.year}年第${item.week}周`;
                    } else if (dimension === 'monthly') {
                        return `${item.year}年${item.month}月`;
                    } else {
                        return `${item.year}年`;
                    }
                });
                
                const salesData = data.map(item => item.total_sales);
                const orderData = data.map(item => item.order_count);
                
                const ctx = document.getElementById('salesTrendChart').getContext('2d');
                
                if (salesTrendChart) {
                    salesTrendChart.destroy();
                }
                
                salesTrendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '销售额',
                                data: salesData,
                                borderColor: '#4e73df',
                                backgroundColor: 'rgba(78, 115, 223, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                yAxisID: 'y'
                            },
                            {
                                label: '订单数',
                                data: orderData,
                                borderColor: '#1cc88a',
                                backgroundColor: 'rgba(28, 200, 138, 0.1)',
                                borderWidth: 2,
                                fill: false,
                                tension: 0.4,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false
                        },
                        scales: {
                            x: {
                            },
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: '销售额 (元)'
                                },
                                ticks: {
                                    callback: function(value) {
                                        return '¥' + value.toLocaleString();
                                    }
                                }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: '订单数'
                                },
                                grid: {
                                    drawOnChartArea: false
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                position: 'top'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) {
                                            label += ': ';
                                        }
                                        if (context.parsed.y !== null) {
                                            if (context.datasetIndex === 0) {
                                                label += formatCurrency(context.parsed.y);
                                            } else {
                                                label += formatNumber(context.parsed.y) + ' 单';
                                            }
                                        }
                                        return label;
                                    }
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('加载销售趋势失败:', error);
                showError('#salesChartContainer', '加载销售趋势失败');
            }
        }
        
        async function loadPaymentDistribution() {
            try {
                const data = await apiGet('/sales/payment-methods', {
                    start_date: $('#startDate').val(),
                    end_date: $('#endDate').val()
                });
                
                if (!data || data.length === 0) {
                    showEmpty('#paymentChartContainer', '暂无支付方式数据');
                    return;
                }
                
                const labels = data.map(item => item.payment_method_name || '其他');
                const salesData = data.map(item => item.total_sales);
                const orderData = data.map(item => item.order_count);
                
                const ctx = document.getElementById('paymentChart').getContext('2d');
                
                if (paymentChart) {
                    paymentChart.destroy();
                }
                
                const colors = [
                    '#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b', '#858796'
                ];
                
                paymentChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: salesData,
                            backgroundColor: colors.slice(0, labels.length),
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const label = context.label || '';
                                        const value = context.parsed || 0;
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = total > 0 ? (value / total * 100) : 0;
                                        return `${label}: ${formatCurrency(value)} (${formatPercent(percentage)})`;
                                    }
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('加载支付方式分布失败:', error);
                showError('#paymentChartContainer', '加载支付方式分布失败');
            }
        }
        
        async function loadTopDevices() {
            try {
                const data = await apiGet('/sales/by-device', {
                    start_date: $('#startDate').val(),
                    end_date: $('#endDate').val(),
                    limit: 10
                });
                
                const tbody = $('#topDevicesTable tbody');
                tbody.empty();
                
                if (!data || data.length === 0) {
                    tbody.append('<tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>');
                    return;
                }
                
                data.forEach((item, index) => {
                    const rank = index + 1;
                    const rankBadge = rank <= 3 
                        ? `<span class="badge badge-${rank === 1 ? 'warning' : rank === 2 ? 'secondary' : 'info'}">${rank}</span>`
                        : `<span class="badge badge-light">${rank}</span>`;
                    
                    tbody.append(`
                        <tr>
                            <td>${rankBadge}</td>
                            <td><strong>${item.device_code || '-'}</strong></td>
                            <td>${item.device_name || '-'}</td>
                            <td class="text-success font-weight-bold">${formatCurrency(item.total_sales)}</td>
                            <td>${formatNumber(item.order_count)} 单</td>
                        </tr>
                    `);
                });
            } catch (error) {
                console.error('加载热销设备排行失败:', error);
            }
        }
        
        async function loadSalesList() {
            try {
                const data = await apiGet('/sales/list', {
                    start_date: $('#startDate').val(),
                    end_date: $('#endDate').val(),
                    page: currentPage,
                    page_size: pageSize
                });
                
                const tbody = $('#salesTable tbody');
                tbody.empty();
                
                if (!data || !data.items || data.items.length === 0) {
                    tbody.append('<tr><td colspan="7" class="text-center text-muted">暂无订单数据</td></tr>');
                    return;
                }
                
                const statusMap = {
                    'pending': { text: '待支付', class: 'warning' },
                    'paid': { text: '已支付', class: 'success' },
                    'completed': { text: '已完成', class: 'info' },
                    'cancelled': { text: '已取消', class: 'danger' },
                    'refunded': { text: '已退款', class: 'secondary' }
                };
                
                const paymentMap = {
                    'alipay': '支付宝',
                    'wechat': '微信支付',
                    'cash': '现金',
                    'card': '银行卡',
                    'other': '其他'
                };
                
                data.items.forEach(item => {
                    const status = statusMap[item.status] || { text: item.status, class: 'secondary' };
                    const payment = paymentMap[item.payment_method] || item.payment_method;
                    
                    tbody.append(`
                        <tr>
                            <td><code>${item.order_no}</code></td>
                            <td>${item.device_name || '-'}</td>
                            <td>${item.user_nickname || '匿名用户'}</td>
                            <td class="text-success font-weight-bold">${formatCurrency(item.total_amount)}</td>
                            <td>${payment}</td>
                            <td><span class="badge badge-${status.class}">${status.text}</span></td>
                            <td>${item.created_at || '-'}</td>
                        </tr>
                    `);
                });
                
                renderPagination(data.total || 0);
            } catch (error) {
                console.error('加载销售明细失败:', error);
            }
        }
        
        function renderPagination(total) {
            const pagination = $('#pagination');
            pagination.empty();
            
            const totalPages = Math.ceil(total / pageSize);
            
            if (totalPages <= 1) return;
            
            const prevDisabled = currentPage <= 1;
            pagination.append(`
                <li class="page-item ${prevDisabled ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}">上一页</a>
                </li>
            `);
            
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, startPage + 4);
            
            for (let i = startPage; i <= endPage; i++) {
                pagination.append(`
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>
                `);
            }
            
            const nextDisabled = currentPage >= totalPages;
            pagination.append(`
                <li class="page-item ${nextDisabled ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}">下一页</a>
                </li>
            `);
            
            pagination.find('a.page-link').on('click', function(e) {
                e.preventDefault();
                const page = parseInt($(this).data('page'));
                if (page >= 1 && page <= totalPages) {
                    currentPage = page;
                    loadSalesList();
                }
            });
        }
    </script>
</body>
</html>
