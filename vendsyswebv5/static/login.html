<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 自动售货机管理系统</title>
    
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    
    <!-- 自定义样式 -->
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        
        .login-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        
        .login-header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            font-weight: 500;
            color: #495057;
            margin-bottom: 8px;
        }
        
        .input-group-text {
            background: #f8f9fa;
            border-right: none;
        }
        
        .form-control {
            border-left: none;
            padding: 12px 15px;
            height: 48px;
        }
        
        .form-control:focus {
            box-shadow: none;
            border-color: #667eea;
        }
        
        .input-group:focus-within .input-group-text {
            border-color: #667eea;
        }
        
        .input-group:focus-within .form-control {
            border-color: #667eea;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .login-footer {
            text-align: center;
            padding: 20px 30px 30px;
            color: #6c757d;
            font-size: 13px;
        }
        
        .alert {
            border-radius: 8px;
            padding: 12px 15px;
        }
        
        .logo-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .test-accounts {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
        }
        
        .test-accounts h6 {
            margin: 0 0 10px 0;
            font-weight: 600;
            color: #495057;
        }
        
        .test-accounts p {
            margin: 5px 0;
            color: #6c757d;
        }
        
        .test-accounts .account-item {
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .test-accounts .account-item:last-child {
            border-bottom: none;
        }
        
        .test-accounts .role {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-cash-register"></i>
            </div>
            <h1>自动售货机管理系统</h1>
            <p>Vending Machine Management System</p>
        </div>
        
        <div class="login-body">
            <div id="alert-container"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                        </div>
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="请输入用户名" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                        </div>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="请输入密码" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> 登 录
                </button>
            </form>
            
            <div class="test-accounts">
                <h6><i class="fas fa-info-circle"></i> 测试账号</h6>
                <div class="account-item">
                    <span class="role">超级管理员</span>
                    admin / 123456
                </div>
                <div class="account-item">
                    <span class="role">运营经理</span>
                    operator / 123456
                </div>
                <div class="account-item">
                    <span class="role">运维人员</span>
                    maintainer / 123456
                </div>
                <div class="account-item">
                    <span class="role">财务人员</span>
                    finance / 123456
                </div>
                <div class="account-item">
                    <span class="role">加盟商</span>
                    franchisee / 123456
                </div>
            </div>
        </div>
        
        <div class="login-footer">
            <p>&copy; 2024 自动售货机管理系统 v1.0</p>
        </div>
    </div>
    
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <!-- Bootstrap 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 公共JS -->
    <script src="js/common.js"></script>
    
    <script>
        // 显示警告
        function showAlert(message, type = 'danger') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type}" role="alert">
                    ${message}
                </div>
            `;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }
        
        // 登录表单验证配置
        const loginValidationConfig = {
            username: {
                rules: [
                    'required',
                    { rule: 'minLength', length: 2, message: '用户名最少需要 2 个字符' },
                    { rule: 'maxLength', length: 50, message: '用户名最多允许 50 个字符' }
                ]
            },
            password: {
                rules: [
                    'required',
                    'password'
                ]
            }
        };

        // 表单提交
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 清除之前的错误
            Validator.clearFormErrors('login-form');
            Validator.clearFormError('login-form');
            
            // 表单验证
            const validation = Validator.validateForm('login-form', loginValidationConfig);
            if (!validation.valid) {
                showAlert('请检查表单填写是否正确');
                return;
            }
            
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const result = await httpPost(`${API_BASE}/api/auth/login`, {
                    username: username,
                    password: password
                });
                
                if (result && result.code === 200) {
                    // 保存token和用户信息
                    setToken(result.data.token);
                    setUserInfo(result.data.user_info);
                    setMenus(result.data.menus);
                    
                    showAlert('登录成功，正在跳转...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/static/index.html';
                    }, 500);
                } else {
                    showAlert(result ? result.message : '登录失败');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登 录';
                }
            } catch (error) {
                console.error('登录错误:', error);
                showAlert('网络错误，请稍后重试');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登 录';
            }
        });
        
        // 实时验证 - 用户名输入时
        document.getElementById('username').addEventListener('blur', function() {
            const result = Validator.validateField(this.value, loginValidationConfig.username.rules);
            if (!result.valid) {
                Validator.showFieldError(this, result.message);
            } else {
                Validator.clearFieldError(this);
            }
        });
        
        // 实时验证 - 密码输入时
        document.getElementById('password').addEventListener('blur', function() {
            const result = Validator.validateField(this.value, loginValidationConfig.password.rules);
            if (!result.valid) {
                Validator.showFieldError(this, result.message);
            } else {
                Validator.clearFieldError(this);
            }
        });
        
        // 检查是否已登录
        document.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            if (token) {
                // 验证token有效性
                httpGet(`${API_BASE}/api/auth/info`).then(result => {
                    if (result && result.code === 200) {
                        window.location.href = '/static/index.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
